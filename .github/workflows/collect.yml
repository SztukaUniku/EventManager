name: Zbieranie wydarzeń

on:
  workflow_dispatch:
  schedule:
    # poniedziałek 03:17 UTC (04:17 w Warszawie zimą, 05:17 latem)
    - cron: "17 3 * * 1"
  push:
    branches: [main, "claude/**"]
    paths:
      - "collector/**"
      - ".github/workflows/collect.yml"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Pobierz źródła
        run: python -m collector.collect
      - name: Zbuduj bazę dla aplikacji
        env:
          REF_A: ${{ secrets.REF_A }}
          REF_B: ${{ secrets.REF_B }}
        run: python -m collector.build
      - name: Zapisz dane w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ app/data/
          git commit -m "Dane: zbieranie wydarzeń $(date -u +%Y-%m-%d)" || echo "Brak zmian"
          git pull --rebase
          git push
