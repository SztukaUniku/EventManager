name: Test źródeł

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe_sources.py"
      - "sources/sources.csv"
      - ".github/workflows/probe-sources.yml"

permissions:
  contents: write

concurrency:
  group: probe-sources
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - run: python scripts/probe_sources.py
      - name: Zapisz raport w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "Raport: test wykonalności źródeł" || echo "Brak zmian"
          git push
